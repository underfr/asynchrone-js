<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TP1 Random User</title>
    <script type="module" src="/src/navbar.js"></script>
  </head>

  <body class="bg-base-200 min-h-screen">
    <main class="flex min-h-screen flex-col items-center justify-center gap-8 p-4">
      <header class="text-center">
        <h1 class="text-3xl font-bold sm:text-4xl">TP: Profil Utilisateur Random</h1>
      </header>

      <div class="card bg-base-100 w-full max-w-sm shadow-xl">
        <div class="card-body items-center gap-5 text-center">
          <div class="avatar">
            <div class="ring-primary ring-offset-base-100 w-28 rounded-full ring ring-offset-2">
              <img id="user-picture" src="" alt="Photo de profil" />
            </div>
          </div>

          <div class="space-y-2">
            <h2 class="card-title justify-center text-2xl" id="user-name"></h2>
            <div class="badge badge-outline badge-secondary" id="user-country"></div>
          </div>

          <ul class="divide-base-200 w-full divide-y text-left text-sm">
            <li class="flex items-center gap-3 py-3">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="text-primary size-5 shrink-0"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75"
                />
              </svg>
              <span class="truncate" id="user-email"></span>
            </li>

            <li class="flex items-center gap-3 py-3">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="text-primary size-5 shrink-0"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 0 0 2.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 0 1-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 0 0-1.091-.852H4.5A2.25 2.25 0 0 0 2.25 4.5v2.25Z"
                />
              </svg>
              <span class="truncate" id="user-phone"></span>
            </li>

            <li class="flex items-center gap-3 py-3">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="text-primary size-5 shrink-0"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
                />
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z"
                />
              </svg>
              <span id="user-address"></span>
            </li>
          </ul>

          <div class="card-actions w-full">
            <button class="btn btn-primary btn-block" id="refresh-btn">
              Utilisateur aléatoire
            </button>
          </div>
        </div>
      </div>
    </main>

    <script type="module" src="random-user.js"></script>
  </body>
</html>
